name: Diagnose Pages certificate
on:
  push:
    paths:
      - '.github/workflows/pages-tls-check.yml'
  workflow_dispatch:
permissions:
  pages: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read public domain certificate state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          req=urllib.request.Request(
            'https://api.github.com/repos/suimouyin/sui-pink/pages',
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                     'Accept':'application/vnd.github+json',
                     'X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req, timeout=30) as response:
              data=json.load(response)
          print(json.dumps({key:data.get(key) for key in
              ['status','cname','https_certificate','https_enforced','build_type']},
              ensure_ascii=False))
          PY
